<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Phase 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; color: #eef4f8; font: 18px/1.4 sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp v1.1 (1280x720, sans-serif >= 18px, >= 30 FPS).
 * CHỈ ĐỌC snapshot từ GET /state và gửi input qua POST /input.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · Esc/P = pause · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

let snap = null;
let offline = false;
let screen = "menu"; // "menu" | "day_intro" | "evening_intro" | "day_result" | "play" | "summary" | "quit"
let introTimer = 0;
let lastPhase = null;
let lastDay = 0;
let lastDaysCompleted = 0;
let hitBoxes = []; // [{x,y,w,h,action}]
let highContrast = false;

function toggleHighContrast() {
  highContrast = !highContrast;
}

function theme() {
  if (highContrast) {
    return {
      bg: "#000000",
      fg: "#ffffff",
      muted: "#ffffff",
      accent: "#ffff00",
      cardBg: "#000000",
      cardBorder: "#ffff00",
      waterTop: "#001b33",
      waterBottom: "#000000",
      quanFloor: "#1a1a1a",
      quanBorder: "#ffffff",
      warnMonster: "#00ffff",
      warnMonsterBorder: "#00ffff",
      warnOxy: "#ff3b30",
      warnCustomer: "#ffff00",
      btnBg: "#000000",
    };
  }
  return {
    bg: "#0f1720",
    fg: "#eef4f8",
    muted: "#b0bec5",
    accent: "#ffd54f",
    cardBg: "rgba(10,16,24,0.88)",
    cardBorder: "#90caf9",
    waterTop: "#49b0dc",
    waterBottom: "#08243f",
    quanFloor: "#c9a36b",
    quanBorder: "#6b4a2b",
    warnMonster: "#e1bee7",
    warnMonsterBorder: "#ab47bc",
    warnOxy: "#ff5252",
    warnCustomer: "#ff5252",
    btnBg: "#37474f",
  };
}

const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const phase = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase === "quan") dy = -dy;
  return {
    move: [dx, dy],
    interact: down.has("interact"),
    catch: down.has("catch"),
    pause: down.has("pause"),
    shop_done: down.has("shop_done"),
  };
}

function sendBody(obj) {
  queue.push(JSON.stringify(obj));
  flush();
}

function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* poll handles offline state */ }
  }
  inflight = false;
}

function pulseButton(btn, extra = {}) {
  sendBody({ ...currentInput(), [btn]: true, ...extra });
  setTimeout(() => sendBody({ ...currentInput(), [btn]: false }), 25);
}

function skipIntroIfAny() {
  if (screen === "day_intro" || screen === "evening_intro" || screen === "day_result") {
    screen = "play";
    introTimer = 0;
    return true;
  }
  return false;
}

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (screen === "menu") {
    if (k === "c" || k === "h") { toggleHighContrast(); return; }
    if (k === "enter" || k === " ") { startGame(); e.preventDefault(); }
    return;
  }
  if (skipIntroIfAny()) { e.preventDefault(); return; }
  if (k === "c" || k === "h") { toggleHighContrast(); return; }
  if (k === "escape" || k === "p") { pulseButton("pause"); e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "1" && snap && snap.phase === "shop") sendBody({ buy: "oxygen" });
  else if (k === "2" && snap && snap.phase === "shop") sendBody({ buy: "hp" });
  else if (k === "enter" && snap && snap.phase === "shop") pulseButton("shop_done");
  else if (k === "r") { restartGame(); return; }
  pushInput();
});

addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});

addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("click", (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  for (const b of hitBoxes) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      b.action();
      return;
    }
  }
  skipIntroIfAny();
});

function startGame() {
  screen = snap && snap.mode === "day" ? "day_intro" : "play";
  introTimer = 240; // 4s @ 60fps
}

function restartGame() {
  fetch("/restart", { method: "POST" });
  lastSent = "";
  down.clear();
  lastPhase = null;
  lastDay = 0;
  lastDaysCompleted = 0;
  screen = snap && snap.mode === "day" ? "day_intro" : "play";
  introTimer = 240;
}

async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const next = await r.json();
    offline = false;
    if (snap && next.mode === "day" && screen !== "menu" && screen !== "quit") {
      if (next.finished) {
        screen = "summary";
      } else if (next.day > lastDay && lastDay > 0) {
        screen = "day_result";
        introTimer = 180;
      } else if (next.phase === "quan" && lastPhase === "gather") {
        screen = "evening_intro";
        introTimer = 180;
      }
    } else if (next.finished && screen === "play") {
      screen = "summary";
    }
    lastPhase = next.phase || next.mode;
    lastDay = next.day || 1;
    lastDaysCompleted = next.days_completed || 0;
    snap = next;
  } catch (e) {
    offline = true;
  }
  setTimeout(poll, 16);
}
poll();

const KIND_COLOR = {
  ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066",
  bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b",
};
const KIND_NAME = {
  ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo",
  bong_dien_dien: "Điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo",
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function text(s, x, y, o = {}) {
  const sz = Math.max(18, o.size || 18);
  ctx.font = (o.bold ? "bold " : "") + sz + "px sans-serif";
  ctx.fillStyle = o.color || theme().fg;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}

function button(label, x, y, w, h, bg, action) {
  const th = theme();
  ctx.fillStyle = highContrast ? th.btnBg : bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = highContrast ? th.accent : "#ffffff";
  ctx.lineWidth = highContrast ? 3 : 2;
  ctx.strokeRect(x, y, w, h);
  text(label, x + w / 2, y + h / 2 + 6, { size: 20, bold: true, align: "center", color: th.fg });
  hitBoxes.push({ x, y, w, h, action });
}

function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.65)";
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 4, { size: 18, bold: true, align: "center" });
}

function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function drawFreshnessBar(items, x, y, w, label) {
  if (!Array.isArray(items)) return;
  const freshCount = items.filter((it) => typeof it === "string" || (it && it.fresh >= 30)).length;
  const spoiledCount = items.length - freshCount;
  const title = label + " (" + freshCount + " tươi" + (spoiledCount > 0 ? ", " + spoiledCount + " ươn" : "") + ")";
  text(title, x, y, { size: 18, bold: true, color: spoiledCount > 0 ? "#ff8a80" : "#eef4f8" });
  const cellW = Math.min(180, Math.max(120, Math.floor((w - 32) / Math.max(1, Math.min(6, items.length)))));
  items.slice(0, 6).forEach((it, idx) => {
    const kind = typeof it === "string" ? it : (it.kind || "?");
    const fresh = typeof it === "object" && it.fresh !== undefined ? it.fresh : 100;
    const spoiled = fresh < 30;
    const cx = x + idx * (cellW + 8);
    const cy = y + 8;
    ctx.fillStyle = spoiled ? "rgba(183,28,28,0.45)" : "rgba(255,255,255,0.12)";
    ctx.fillRect(cx, cy, cellW, 28);
    const col = spoiled ? "#ef5350" : fresh >= 60 ? "#66bb6a" : "#ffa726";
    ctx.fillStyle = col;
    ctx.fillRect(cx, cy + 22, cellW * Math.max(0, Math.min(1, fresh / 100)), 6);
    const tag = (KIND_NAME[kind] || kind) + " " + Math.round(fresh) + "%" + (spoiled ? " [ƯƠN]" : "");
    text(tag, cx + 6, cy + 18, { size: 18, color: spoiled ? "#ffcdd2" : "#eef4f8" });
  });
}

function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 74, bottom = 72;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  const th = theme();
  ctx.fillStyle = highContrast ? "#000000" : "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, th.waterTop); g.addColorStop(1, th.waterBottom);
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.strokeStyle = "rgba(255,230,150,.8)"; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.2), { size: 18, align: "center", color: "#3d2614" });

  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 1.0 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { size: 18, align: "center", color: "#123" });
  });

  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.95 * s, 0.48 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.8 * s, { size: 18, align: "center" });
  });

  const p = snap.player;
  let monsterDanger = false;
  (snap.monsters || []).forEach((m) => {
    const nearMonster = p && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10;
    if (m.state === "chase" || nearMonster) monsterDanger = true;
    ctx.fillStyle = m.state === "chase" ? (highContrast ? "#00ffff" : "#b388ff") : m.state === "recoil" ? "#90a4ae" : "#4caf50";
    ctx.fillRect(sx(m.pos[0]) - 1.1 * s, sy(m.pos[1]) - 0.55 * s, 2.2 * s, 1.1 * s);
    text(m.id + " (" + m.state + ")", sx(m.pos[0]), sy(m.pos[1]) - 0.8 * s, { size: 18, align: "center", color: th.accent });
  });

  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 4) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  // HUD v1.3 (>= 18px, 3 cảnh báo chữ + biểu tượng)
  const lowTime = snap.time_left_ticks <= 30 * 60;
  text("Ngày " + (snap.day || 1) + " · ⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, bold: true, color: lowTime ? th.warnOxy : th.fg });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const frac = p.oxygen_ticks / p.oxygen_max_ticks;
    bar(220, 12, 240, 26, frac, frac < 0.25 ? th.warnOxy : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    if (p.oxygen_ticks === 0) {
      text("⚠ Hết hơi!", 480, 34, { size: 22, bold: true, color: th.warnOxy });
    } else if (frac < 0.25) {
      text("⚠ Oxy sắp hết!", 480, 34, { size: 22, bold: true, color: th.warnOxy });
    }
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 670, 34, { size: 24, color: p.hp / p.hp_max < 0.25 ? th.warnOxy : "#ff6b81" });
  }
  if (monsterDanger || (p && p.invuln_ticks > 60)) {
    ctx.strokeStyle = th.warnMonsterBorder; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w - 8, h - 8);
    text("⚠ Thủy quái!", w - 20, 34, { size: 22, bold: true, align: "right", color: th.warnMonster });
  }
  drawDayPlanChecklist(w - 280, 60);
  if (snap.hold && snap.hold_capacity) {
    drawFreshnessBar(snap.hold, 16, h - 68, w - 32, "Giỏ " + snap.hold.length + "/" + snap.hold_capacity);
    button("Tương phản cao: " + (highContrast ? "Bật" : "Tắt") + " (C)", 16, h - 34, 250, 30, th.btnBg, toggleHighContrast);
    text("WASD bơi · E hái/cập bến · Space bắt cá · Esc/P tạm dừng", w - 16, h - 14, { size: 18, align: "right", color: th.muted });
  }
}

function drawDayPlanChecklist(x, y) {
  const plan = snap.day_plan;
  if (!plan || !plan.dishes) return;
  ctx.fillStyle = "rgba(15,23,32,0.75)";
  ctx.fillRect(x - 10, y - 24, 270, 120);
  text("Kế hoạch Ngày " + (snap.day || 1), x, y, { size: 18, bold: true, color: "#ffd54f" });
  const dishes = Object.keys(plan.dishes);
  dishes.slice(0, 3).forEach((d, idx) => {
    text("• " + d + " ×" + plan.dishes[d], x, y + 28 + idx * 24, { size: 18 });
  });
}

function drawQuan(w, h) {
  const th = theme();
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 74, bottom = 52;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = th.quanFloor; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = th.quanBorder; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  (snap.stoves || []).forEach((st) => {
    ctx.fillStyle = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 6, { size: 18, align: "center", color: "#111" });
  });

  const patienceMaxTicks = (meta.patience_s || 60) * 60;
  let angryCustomer = false;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 6, { size: 18, align: "center" });
    const c = byTable[tb.id];
    if (c) {
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2";
      ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]) - 1.5 * s, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(c.dish_id || "?", sx(tb.pos[0]), sy(tb.pos[1]) - 2.2 * s, { size: 18, align: "center", color: highContrast ? "#ffffff" : "#2a1a0a" });
      if (c.state !== "eating" && c.patience_ticks_left !== undefined) {
        const pRatio = Math.max(0, Math.min(1, c.patience_ticks_left / patienceMaxTicks));
        const pCol = pRatio < 0.25 ? (highContrast ? "#ff3b30" : "#ef5350") : pRatio < 0.5 ? (highContrast ? "#ffff00" : "#ffa726") : "#66bb6a";
        bar(sx(tb.pos[0]) - 0.9 * s, sy(tb.pos[1]) - 3.1 * s, 1.8 * s, 10, pRatio, pCol, "");
        if (pRatio < 0.25) angryCustomer = true;
      }
    }
  });

  const p = snap.player;
  if (p) {
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(sx(p.pos[0]), sy(p.pos[1]), 0.55 * s, 0, Math.PI * 2); ctx.fill();
  }

  const lowTime = snap.time_left_ticks <= 30 * 60;
  text("Ngày " + (snap.day || 1) + " · ⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, bold: true, color: lowTime ? th.warnOxy : th.fg });
  text("Tiền: " + (snap.money || 0) + " · Uy tín: " + (snap.reputation || 0).toFixed(1) + " · Điểm: " + (snap.score || 0), 260, 32, { size: 20, bold: true });
  if (angryCustomer) {
    ctx.strokeStyle = th.warnCustomer; ctx.lineWidth = 6; ctx.strokeRect(4, 4, w - 8, h - 8);
    text("⚠ Khách sắp giận!", w - 20, 34, { size: 22, bold: true, align: "right", color: th.warnCustomer });
  }
  if (Array.isArray(snap.stock)) {
    drawFreshnessBar(snap.stock, 16, 56, w - 32, "Kho");
  } else {
    const stockTxt = Object.keys(snap.stock || {}).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]).join(", ");
    text("Kho: " + (stockTxt || "(trống)"), 16, 60, { size: 18, color: th.muted });
  }
  button("Tương phản cao: " + (highContrast ? "Bật" : "Tắt") + " (C)", 16, h - 38, 250, 30, th.btnBg, toggleHighContrast);
  text("WASD đi · E tương tác · Esc/P tạm dừng", w - 16, h - 18, { size: 18, align: "right", color: th.muted });
}

function drawShop(w, h) {
  text("CỬA HÀNG CUỐI NGÀY " + (snap.day || 1), w / 2, 90, { size: 28, bold: true, align: "center", color: "#ffd54f" });
  text("Tiền hiện có: " + (snap.money || 0) + " · Còn: " + fmtTime(snap.time_left_ticks), w / 2, 130, { size: 20, align: "center" });
  const up = snap.upgrades || { oxygen: 0, hp: 0 };
  button("1. Nâng Bình Oxy (Cấp " + (up.oxygen || 0) + "/2)", w / 2 - 220, 200, 440, 64, "#1e88e5", () => sendBody({ buy: "oxygen" }));
  button("2. Nâng Máu Tối Đa (Cấp " + (up.hp || 0) + "/2)", w / 2 - 220, 290, 440, 64, "#e53935", () => sendBody({ buy: "hp" }));
  button("Xong (Enter)", w / 2 - 140, 390, 280, 60, "#43a047", () => pulseButton("shop_done"));
  if (Array.isArray(snap.stock) && snap.stock.length > 0) {
    drawFreshnessBar(snap.stock, 16, h - 78, w - 32, "Kho dư ca tối");
  }
}

function drawCenteredCard(w, h, title, subtitle, btnLabel, btnAction) {
  const th = theme();
  ctx.fillStyle = th.cardBg;
  ctx.fillRect(w / 2 - 300, h / 2 - 150, 600, 300);
  ctx.strokeStyle = th.cardBorder; ctx.lineWidth = 3;
  ctx.strokeRect(w / 2 - 300, h / 2 - 150, 600, 300);
  text(title, w / 2, h / 2 - 60, { size: 28, bold: true, align: "center", color: th.accent });
  text(subtitle, w / 2, h / 2, { size: 20, align: "center", color: th.fg });
  button(btnLabel, w / 2 - 130, h / 2 + 50, 260, 56, "#1e88e5", btnAction);
}

function frame() {
  requestAnimationFrame(frame);
  hitBoxes = [];
  const [w, h] = fit();
  const th = theme();
  ctx.fillStyle = th.bg;
  ctx.fillRect(0, 0, w, h);

  if (introTimer > 0) {
    introTimer--;
    if (introTimer === 0 && (screen === "day_intro" || screen === "evening_intro" || screen === "day_result")) {
      screen = "play";
    }
  }

  if (screen === "menu") {
    text("QUÁN ĂN CHỢ NỔI", w / 2, h / 2 - 120, { size: 36, bold: true, align: "center", color: th.accent });
    button("Chơi", w / 2 - 140, h / 2 - 40, 280, 56, "#43a047", startGame);
    button("Tương phản cao: " + (highContrast ? "Bật" : "Tắt") + " (C)", w / 2 - 140, h / 2 + 30, 280, 52, th.btnBg, toggleHighContrast);
    button("Thoát", w / 2 - 140, h / 2 + 96, 280, 56, "#546e7a", () => { screen = "quit"; });
    return;
  }
  if (screen === "quit") {
    text("Đã thoát trò chơi. Nhấn R để quay lại.", w / 2, h / 2, { size: 22, align: "center" });
    return;
  }
  if (!snap) {
    text(offline ? "Mất kết nối máy chủ…" : "Đang tải…", w / 2, h / 2, { size: 22, align: "center" });
    return;
  }

  const phase = snap.phase || snap.mode;
  if (phase === "shop") drawShop(w, h);
  else if (phase === "quan") drawQuan(w, h);
  else drawGather(w, h);

  if (screen === "day_intro") {
    drawCenteredCard(w, h, "NGÀY " + (snap.day || 1), "Chuẩn bị lặn hái nguyên liệu!", "Bắt đầu ngay", () => { screen = "play"; introTimer = 0; });
  } else if (screen === "evening_intro") {
    drawCenteredCard(w, h, "BUỔI TỐI — MỞ QUÁN", "Phục vụ khách theo kế hoạch ngày!", "Mở quán", () => { screen = "play"; introTimer = 0; });
  } else if (screen === "day_result") {
    drawCenteredCard(w, h, "KẾT QUẢ NGÀY " + ((snap.day || 2) - 1), "Tổng thu: " + (snap.earned || 0) + " · Điểm: " + (snap.score || 0), "Tiếp tục", () => { screen = "play"; introTimer = 0; });
  } else if (snap.state === "paused") {
    drawCenteredCard(w, h, "TẠM DỪNG", "Nhấn Esc / P để tiếp tục · C/H đổi tương phản", "Tiếp tục", () => pulseButton("pause"));
    button("Tương phản cao: " + (highContrast ? "Bật" : "Tắt"), w / 2 - 140, h / 2 + 120, 280, 48, theme().btnBg, toggleHighContrast);
  } else if (screen === "summary" || snap.finished) {
    drawCenteredCard(w, h, "TỔNG KẾT", "Tiền: " + (snap.money || 0) + " · Điểm: " + (snap.score || 0), "Chơi lại (R)", restartGame);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
